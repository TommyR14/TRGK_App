<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coaching Hub</title>
<meta name="theme-color" content="#0b0b0b" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- Icon sprite (all icons defined once, reused via <use>) -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z" fill="currentColor"/></symbol>
  <symbol id="icon-drills" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.2 15.5 9.7 14.2 13.8H9.8L8.5 9.7Z" fill="currentColor"/><path d="M12 7.2V3.6M15.5 9.7l3.3-1.6M14.2 13.8l1.9 3.1M9.8 13.8l-1.9 3.1M8.5 9.7 5.2 8.1" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="icon-schedule" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M7 2.5v4M17 2.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="6.5" y="12" width="3" height="3" fill="currentColor"/><rect x="10.5" y="12" width="3" height="3" fill="currentColor"/><rect x="14.5" y="12" width="3" height="3" fill="currentColor"/></symbol>
  <symbol id="icon-about" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="icon-film" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9.5h18M7 5.5l-1.6 4M12.5 5.5l-1.6 4M18 5.5l-1.6 4" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="icon-backup" viewBox="0 0 24 24"><path d="M12 3v11m0 0-3.5-3.5M12 14l3.5-3.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 15v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="icon-admin" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.6 7.5 9.5 4.3-.9 7.5-4.9 7.5-9.5V6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12.3 11.2 14.5 15.5 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M15 8l4 4-4 4M19 12H9" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="topbar" id="topbar" style="display:none">
  <nav class="nav" id="nav">
    <button class="nav-item" data-tab="home">
      <svg class="nav-icon"><use href="#icon-home"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="drills">
      <svg class="nav-icon"><use href="#icon-drills"/></svg>
      <span>Drills</span>
    </button>
    <button class="nav-item" data-tab="scheduling">
      <svg class="nav-icon"><use href="#icon-schedule"/></svg>
      <span>Scheduling</span>
    </button>
    <button class="nav-item" data-tab="about">
      <svg class="nav-icon"><use href="#icon-about"/></svg>
      <span>About Me</span>
    </button>
    <button class="nav-item" data-tab="film">
      <svg class="nav-icon"><use href="#icon-film"/></svg>
      <span>Film</span>
    </button>
    <button class="nav-item coach-only" data-tab="admin">
      <svg class="nav-icon"><use href="#icon-admin"/></svg>
      <span>Admin</span>
    </button>
  </nav>
  <button class="backup-btn coach-only" id="backupBtn" title="Backup your data">
    <svg class="nav-icon"><use href="#icon-backup"/></svg>
    <span>Backup</span>
  </button>
  <button class="backup-btn" id="signOutBtn" title="Sign out">
    <svg class="nav-icon"><use href="#icon-logout"/></svg>
    <span>Sign Out</span>
  </button>
</header>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1>Coaching Hub</h1>
    <p class="section-sub" id="authSubtitle">Sign in to view your drills, schedule, and film.</p>
    <form id="authForm">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password" minlength="6" />
      </div>
      <div class="field" id="authErrorField" style="display:none;">
        <div class="auth-error" id="authError"></div>
      </div>
      <button type="submit" class="btn" id="authSubmitBtn" style="width:100%;justify-content:center;">Sign In</button>
    </form>
    <button class="auth-toggle" id="authToggle">Need an account? Sign up</button>
  </div>
</div>

<main id="app" style="display:none">
  <section class="tab-view" id="view-home" data-tab="home"></section>
  <section class="tab-view" id="view-drills" data-tab="drills"></section>
  <section class="tab-view" id="view-scheduling" data-tab="scheduling"></section>
  <section class="tab-view" id="view-about" data-tab="about"></section>
  <section class="tab-view" id="view-film" data-tab="film"></section>
  <section class="tab-view" id="view-admin" data-tab="admin"></section>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase (pinned version, compat SDK so it drops into plain <script> tags with no build step) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/home.js"></script>
<script src="js/drills.js"></script>
<script src="js/scheduling.js"></script>
<script src="js/about.js"></script>
<script src="js/film.js"></script>
<script src="js/admin.js"></script>
<script src="js/backup.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
